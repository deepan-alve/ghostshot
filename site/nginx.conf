server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri.html $uri/ =404; }
  error_page 404 /404.html;
  location ~* \.(woff2|webp|png|svg|css|js)$ { add_header Cache-Control "public, max-age=604800"; }
  # no-transform stops Cloudflare from injecting its Web Analytics beacon. The site promises no analytics.
  add_header Cache-Control "no-transform" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Everything comes from this site. The demo copies text with the Clipboard API, which needs no extra source.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
