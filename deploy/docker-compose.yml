# ghostshot.deepanalve.dev on Dokploy (biriyani). Compose app "ghostshot-site". Static, no secrets.

services:
  site:
    build:
      context: ..
      dockerfile: site.Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.ghostshot-web.entrypoints=web
      - traefik.http.routers.ghostshot-web.rule=Host(`ghostshot.deepanalve.dev`)
      - traefik.http.routers.ghostshot-web.middlewares=redirect-to-https@file
      - traefik.http.routers.ghostshot-websecure.entrypoints=websecure
      - traefik.http.routers.ghostshot-websecure.rule=Host(`ghostshot.deepanalve.dev`)
      - traefik.http.routers.ghostshot-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.ghostshot.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
